<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">ReplayOps incident proof loop</title>
  <desc id="desc">A six-stage incident workflow from live evidence through diagnosis, testing, replay, approval, and verified recovery.</desc>
  <defs><style>
    .bg{fill:#eef3f5}.panel{fill:#fbfcfc;stroke:#bccbd0;stroke-width:2}.dark{fill:#26353d}.accent{fill:#eb773b}.info{fill:#258fa4}.success{fill:#398b68}.warn{fill:#b58124}.txt{font:600 24px 'Arial';fill:#26353d}.small{font:400 16px 'Arial';fill:#536873}.label{font:600 13px 'Arial';letter-spacing:1.5px;fill:#71838b}.white{fill:#f7fafb}.arrow{stroke:#71838b;stroke-width:3;fill:none;marker-end:url(#head)}
  </style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71838b"/></marker></defs>
  <rect class="bg" width="1440" height="720" rx="32"/>
  <text x="72" y="72" class="label">REPLAYOPS · INCIDENT TIME MACHINE</text><text x="72" y="112" class="txt" style="font-size:34px">From alert noise to a defensible production decision</text>
  <path class="arrow" d="M268 255 H322"/><path class="arrow" d="M528 255 H582"/><path class="arrow" d="M788 255 H842"/><path class="arrow" d="M1048 255 H1102"/>
  <g transform="translate(62 174)"><rect class="panel" width="206" height="162" rx="18"/><circle class="info" cx="30" cy="31" r="10"/><text x="52" y="37" class="label">01 · LIVE EVIDENCE</text><text x="22" y="80" class="txt">Ingest &amp; group</text><text x="22" y="111" class="small">GitHub, Grafana, OTLP</text><text x="22" y="136" class="small">or a human observation</text></g>
  <g transform="translate(322 174)"><rect class="panel" width="206" height="162" rx="18"/><circle class="warn" cx="30" cy="31" r="10"/><text x="52" y="37" class="label">02 · DIAGNOSE</text><text x="22" y="80" class="txt">Rank causes</text><text x="22" y="111" class="small">Completeness ≠ causality</text><text x="22" y="136" class="small">Explain every score</text></g>
  <g transform="translate(582 174)"><rect class="dark" width="206" height="162" rx="18"/><circle class="accent" cx="30" cy="31" r="10"/><text x="52" y="37" class="label white">03 · FALSIFY</text><text x="22" y="80" class="txt white">Run the test</text><text x="22" y="111" class="small white">Assign an owner</text><text x="22" y="136" class="small white">Record the outcome</text></g>
  <g transform="translate(842 174)"><rect class="panel" width="206" height="162" rx="18"/><circle class="accent" cx="30" cy="31" r="10"/><text x="52" y="37" class="label">04 · REPLAY</text><text x="22" y="80" class="txt">Save exact inputs</text><text x="22" y="111" class="small">Compare candidates</text><text x="22" y="136" class="small">Detect stale evidence</text></g>
  <g transform="translate(1102 174)"><rect class="panel" width="276" height="162" rx="18"/><circle class="success" cx="30" cy="31" r="10"/><text x="52" y="37" class="label">05 · APPROVE &amp; VERIFY</text><text x="22" y="80" class="txt">Human control</text><text x="22" y="111" class="small">Independent replay approval</text><text x="22" y="136" class="small">Measured recovery before close</text></g>
  <path class="arrow" d="M1240 354 C1240 505 1110 566 945 566 H320 C175 566 128 475 128 362"/>
  <g transform="translate(360 430)"><rect class="panel" width="720" height="112" rx="18"/><text x="28" y="38" class="label">LEARNING LOOP</text><text x="28" y="72" class="txt">Handoff + postmortem + similar incident evidence</text><text x="28" y="96" class="small">The next incident starts with tested knowledge, not folklore.</text></g>
  <text x="72" y="658" class="small">AI may challenge and summarize. Deterministic rules and humans create, approve, and close incidents.</text>
</svg>
