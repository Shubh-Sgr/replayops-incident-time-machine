<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">ReplayOps end-to-end system flow</title>
  <desc id="desc">Operational data flows from GitHub, Grafana, OpenTelemetry, and generic webhooks through security verification, a durable queue, normalization, impact policy, incident grouping, diagnosis, AI review, and human-approved action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60778a"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17324a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#edf3f6}.panel{fill:#f8fafb;stroke:#c7d6df;stroke-width:1}.dark{fill:#22384a}.accent{fill:#e9753d}.cyan{fill:#d9edf1}.green{fill:#dff1e8}.orange{fill:#f9e3d6}.muted{fill:#60778a}.ink{fill:#22313e}.white{fill:#f7fafc}.label{font:600 14px 'IBM Plex Sans',Arial,sans-serif}.title{font:600 32px Outfit,Arial,sans-serif}.sub{font:400 14px 'IBM Plex Sans',Arial,sans-serif}.small{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.02em}.line{stroke:#60778a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="880" rx="24"/>
  <text x="64" y="70" class="title ink">ReplayOps evidence-to-decision architecture</text>
  <text x="64" y="102" class="sub muted">Deterministic control plane with optional, evidence-grounded AI assistance</text>

  <g transform="translate(64 150)">
    <text x="0" y="0" class="small muted">EVIDENCE SOURCES</text>
    <rect x="0" y="24" width="210" height="78" rx="14" class="panel"/><text x="24" y="58" class="label ink">GitHub</text><text x="24" y="81" class="sub muted">push · deploy · workflow</text>
    <rect x="0" y="118" width="210" height="78" rx="14" class="panel"/><text x="24" y="152" class="label ink">Grafana</text><text x="24" y="175" class="sub muted">firing · resolved alerts</text>
    <rect x="0" y="212" width="210" height="78" rx="14" class="panel"/><text x="24" y="246" class="label ink">OpenTelemetry</text><text x="24" y="269" class="sub muted">traces · logs · metrics</text>
    <rect x="0" y="306" width="210" height="78" rx="14" class="panel"/><text x="24" y="340" class="label ink">Generic webhook</text><text x="24" y="363" class="sub muted">trusted normalized JSON</text>
  </g>

  <path d="M290 361 H354" class="line"/>

  <g transform="translate(355 150)">
    <text x="0" y="0" class="small muted">INGESTION CONTROL PLANE</text>
    <rect x="0" y="24" width="278" height="112" rx="14" class="dark" filter="url(#lift)"/>
    <text x="24" y="60" class="label white">1 · Verify source</text>
    <text x="24" y="84" class="sub white">HMAC signature or constant-time token</text>
    <text x="24" y="108" class="small" fill="#c7d8e5">RAW BODY PRESERVED</text>

    <rect x="0" y="158" width="278" height="112" rx="14" class="panel"/>
    <text x="24" y="194" class="label ink">2 · Durable queue</text>
    <text x="24" y="218" class="sub muted">Persist · deduplicate · retry · dead letter</text>
    <text x="24" y="242" class="small muted">POSTGRESQL OR MEMORY DEMO</text>

    <rect x="0" y="292" width="278" height="112" rx="14" class="panel"/>
    <text x="24" y="328" class="label ink">3 · Normalize evidence</text>
    <text x="24" y="352" class="sub muted">One signal contract for every provider</text>
    <text x="24" y="376" class="small muted">0–100 IMPACT · SEVERITY · CONTEXT</text>
  </g>

  <path d="M633 361 H697" class="line"/>

  <g transform="translate(698 150)">
    <text x="0" y="0" class="small muted">INCIDENT DECISION ENGINE</text>
    <rect x="0" y="24" width="300" height="112" rx="14" class="orange"/>
    <text x="24" y="60" class="label ink">4 · Apply intake policy</text>
    <text x="24" y="84" class="sub ink">Threshold · suppression · maintenance</text>
    <text x="24" y="108" class="small muted">DETERMINISTIC — AI NOT REQUIRED</text>

    <rect x="0" y="158" width="300" height="112" rx="14" class="cyan"/>
    <text x="24" y="194" class="label ink">5 · Group related signals</text>
    <text x="24" y="218" class="sub ink">Correlation · service graph · time window</text>
    <text x="24" y="242" class="small muted">PRECURSOR BACKFILL: −30M / +5M</text>

    <rect x="0" y="292" width="300" height="112" rx="14" class="green"/>
    <text x="24" y="328" class="label ink">6 · Create or update incident</text>
    <text x="24" y="352" class="sub ink">Timeline · state · activities · recovery</text>
    <text x="24" y="376" class="small muted">AUTOMATION OWNER · AUTO-* CODE</text>
  </g>

  <path d="M998 361 H1062" class="line"/>

  <g transform="translate(1063 150)">
    <text x="0" y="0" class="small muted">RESPONDER PROOF LOOP</text>
    <rect x="0" y="24" width="313" height="112" rx="14" class="panel"/>
    <text x="24" y="60" class="label ink">7 · Diagnose</text>
    <text x="24" y="84" class="sub muted">Candidates · deltas · hypotheses · gaps</text>
    <text x="24" y="108" class="small muted">EXPLAINABLE HEURISTICS</text>

    <rect x="0" y="158" width="313" height="112" rx="14" class="panel"/>
    <text x="24" y="194" class="label ink">8 · Challenge with AI</text>
    <text x="24" y="218" class="sub muted">Semantic retrieval · redaction · citations</text>
    <text x="24" y="242" class="small muted">OPTIONAL PROVIDER</text>

    <rect x="0" y="292" width="313" height="112" rx="14" class="dark" filter="url(#lift)"/>
    <text x="24" y="328" class="label white">9 · Human decision</text>
    <text x="24" y="352" class="sub white">Replay · approval · handoff · resolution</text>
    <text x="24" y="376" class="small" fill="#c7d8e5">AI CANNOT APPROVE OR EXECUTE</text>
  </g>

  <g transform="translate(355 642)">
    <rect x="0" y="0" width="1021" height="154" rx="14" class="panel"/>
    <text x="24" y="38" class="label ink">Cross-cutting controls</text>
    <g transform="translate(24 60)">
      <rect width="224" height="64" rx="12" class="cyan"/><text x="18" y="27" class="label ink">Tenant isolation</text><text x="18" y="48" class="sub muted">Auth · membership · RLS</text>
      <rect x="242" width="224" height="64" rx="12" class="green"/><text x="260" y="27" class="label ink">Governance</text><text x="260" y="48" class="sub muted">Roles · audit · approvals</text>
      <rect x="484" width="224" height="64" rx="12" class="orange"/><text x="502" y="27" class="label ink">Trust boundary</text><text x="502" y="48" class="sub muted">Redaction · evidence citations</text>
      <rect x="726" width="247" height="64" rx="12" class="dark"/><text x="744" y="27" class="label white">Graceful fallback</text><text x="744" y="48" class="sub" fill="#c7d8e5">No AI key · no paid queue</text>
    </g>
  </g>
</svg>
