services:
  - type: web
    name: replayops-incident-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_MODE
        value: "false"
      - key: WEB_ORIGIN
        value: https://replayops-incident-time-machine.vercel.app
      - key: PUBLIC_API_URL
        value: https://replayops-incident-api.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://replayops-incident-time-machine.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: INVITE_FROM_EMAIL
        sync: false
      - key: INGESTION_SIGNING_SECRET
        generateValue: true
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GOOGLE_AI_CHAT_MODEL
        value: gemini-3.8-flash
      - key: GOOGLE_AI_EMBEDDING_MODEL
        value: gemini-embedding-2
