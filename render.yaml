services:
  - type: web
    name: replayops-incident-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_MODE
        value: "true"
      - key: WEB_ORIGIN
        value: https://replayops-incident-time-machine.vercel.app
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
