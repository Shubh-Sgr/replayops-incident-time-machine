# Safe incident drill for ReplayOps: runs only on the replayops-drill branch and never deploys real code.
# Each push simulates a production release of the "drill" service: it creates a GitHub Deployment to
# "production", runs a fake health check, and reports the deployment status, exactly like a CD job or
# Vercel would. A commit message containing [fail] makes the health check (and the deployment) fail.
name: ReplayOps incident drill

on:
  push:
    branches: [replayops-drill]

permissions:
  contents: read
  deployments: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create production deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo, ref: context.sha, environment: "production", auto_merge: false,
              required_contexts: [], description: "ReplayOps drill release"
            });
            core.setOutput("id", data.id);

      - name: Simulated post-deploy health check
        id: health
        continue-on-error: true
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" == *"[fail]"* ]]; then
            echo "::error::Simulated health check failure: GET /health returned 502 after rollout"
            exit 1
          fi
          echo "Health check passed: GET /health returned 200"

      - name: Report deployment status
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const failed = process.env.OUTCOME !== "success";
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID), state: failed ? "failure" : "success",
              environment: "production", description: failed ? "Health check returned 502 after rollout" : "Health check passed",
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (failed) core.setFailed("Simulated health check failed after rollout");
